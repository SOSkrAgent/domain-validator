services:
  streamlit:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-0}
    ports:
      - "8501:8501"
    environment:
      - OPENCLAW_URL=${OPENCLAW_URL:-https://opencode.ai/zen/go/v1}
      - OPENCLAW_API_KEY=${OPENAI_API_KEY:-sk-demo}
      - LLM_MODEL=${LLM_MODEL:-hy3}
      - RESELLERCLUB_URL=${RESELLERCLUB_URL:-https://test.httpapi.com}
      - RESELLERCLUB_API_KEY=${RESELLERCLUB_API_KEY:-}
