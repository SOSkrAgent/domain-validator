services:
  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENCLAW_URL=${OPENCLAW_URL:-https://api.openai.com/v1}
      - OPENCLAW_API_KEY=${OPENAI_API_KEY:-sk-demo}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - RESELLERCLUB_USER_ID=${RESELLERCLUB_USER_ID:-}
      - RESELLERCLUB_API_KEY=${RESELLERCLUB_API_KEY:-}
